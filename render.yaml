services:
  - type: web
    name: avantico-audit
    runtime: python
    plan: free
    buildCommand: echo "no dependencies"
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PSI_KEY
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
